services:
  api:
    image: jobmarket-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=JobMarket;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "JobMarketAPI"
      Jwt__Audience: "JobMarketClient"
      Jwt__AccessTokenExpiryMinutes: "15"
      Jwt__RefreshTokenExpiryDays: "7"
      OpenAi__ApiKey: "${OPENAI_API_KEY}"
      OpenAi__EmbeddingModel: "text-embedding-3-small"
      OpenAi__ChatModel: "gpt-4o-mini"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobmarket

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: JobMarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d JobMarket"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jobmarket

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jobmarket

volumes:
  postgres_data:
  redis_data:

networks:
  jobmarket:
    driver: bridge
